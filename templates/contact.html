{{bandeau}}
    <form id="contact-form" class="form" action="{{form-action}}" method="POST">

      <!-- Piège à robots -->
      <div style="display:none" aria-hidden="true">
        <input type="text" name="_gotcha" tabindex="-1" autocomplete="off">
      </div>

      <fieldset class="fieldset">
        <legend>Où se situe votre projet&nbsp;?</legend>

        <div class="form-group">
          <label for="projet_adresse">Adresse du projet</label>
          <input type="text" id="projet_adresse" name="projet_adresse"
                 placeholder="Rue, lieu-dit…">
        </div>

        <div class="form-group">
          <label for="ville">Ville</label>
          <input type="text" id="ville" name="ville" placeholder="Paray-le-Monial">
        </div>

        <div class="form-group">
          <span class="field-label">Référence cadastrale</span>
          <div class="cadastre">
            <div>
              <label for="cadastre_section">Section</label>
              <input type="text" id="cadastre_section" name="cadastre_section"
                     maxlength="2" pattern="[A-Za-z]{1,2}" placeholder="AB"
                     inputmode="latin" title="Une ou deux lettres">
            </div>
            <div>
              <label for="cadastre_numero">Numéro de parcelle</label>
              <input type="text" id="cadastre_numero" name="cadastre_numero"
                     pattern="[0-9]{1,5}" placeholder="0142" inputmode="numeric"
                     title="Le numéro de parcelle">
            </div>
          </div>
          <p class="hint">
            Figure sur votre acte de propriété ou sur votre avis de taxe foncière.
            Laissez vide si vous ne la connaissez pas.
          </p>
        </div>
      </fieldset>

      <fieldset class="fieldset">
        <legend>Votre demande</legend>

        <div class="form-group">
          <label for="demande">Nature de la demande</label>
          <select id="demande" name="demande" required>
            <option value="" selected disabled>Choisissez…</option>
{{options-demande}}
            <option value="Autre">Autre</option>
          </select>
        </div>

        <div class="form-group">
          <label for="contexte">Contexte du projet</label>
          <textarea id="contexte" name="contexte"
                    placeholder="Si vous le souhaitez, vous pouvez me donner le contexte de votre projet."></textarea>
        </div>
      </fieldset>

      <fieldset class="fieldset">
        <legend>Vous</legend>

        <div class="form-row">
          <div class="form-group">
            <label for="nom">Nom</label>
            <input type="text" id="nom" name="nom" required autocomplete="family-name">
          </div>
          <div class="form-group">
            <label for="prenom">Prénom</label>
            <input type="text" id="prenom" name="prenom" required autocomplete="given-name">
          </div>
        </div>

        <!-- Le projet ayant été situé plus haut, on peut demander ici si le
             demandeur y réside, plutôt que l'inverse. -->
        <div class="form-group">
          <span class="field-label">Votre adresse postale</span>
          <label class="choice">
            <input type="radio" name="adresse_type" value="identique" checked>
            Identique à l'adresse du projet
          </label>
          <label class="choice">
            <input type="radio" name="adresse_type" value="autre">
            Autre adresse
          </label>
        </div>

        <div class="form-group" id="adresse-group" hidden>
          <label for="adresse">Adresse postale</label>
          <input type="text" id="adresse" name="adresse" autocomplete="street-address">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="tel">Téléphone</label>
            <input type="tel" id="tel" name="tel" required autocomplete="tel">
          </div>
          <div class="form-group">
            <label for="email">Courriel</label>
            <input type="email" id="email" name="email" required autocomplete="email">
          </div>
        </div>
      </fieldset>

      <button type="submit" class="btn btn--primary">Envoyer ma demande</button>
      <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
    </form>
