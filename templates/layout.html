<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{page-title}}</title>
  <meta name="description" content="{{page-description}}">
  <meta name="author" content="{{nom}}">
  <meta name="robots" content="{{page-robots}}">
  <meta property="og:title" content="{{page-title}}">
  <meta property="og:description" content="{{og-description}}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://{{domaine}}/{{chemin}}">
  <link rel="canonical" href="https://{{domaine}}/{{chemin}}">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<a class="saut-contenu" href="#contenu">Aller au contenu</a>

<!-- ====== En-tête, collant en haut ====== -->
<header class="site-header">
  <div class="container">
    <!-- Emblème officiel en couleurs (vectoriel, issu de l'EPS du pack).
         Ses teintes étant sombres, il repose sur une pastille claire : ni les
         couleurs ni les proportions de l'emblème ne sont retouchées. -->
    <img class="ordre-logo" src="images/logo-geometre-expert.svg"
         alt="{{ordre-libelle}}" width="578" height="308">
    <div class="brand">
      <!-- Un seul lien enveloppe le nom et la fonction : deux liens voisins
           vers la même page seraient annoncés deux fois par un lecteur
           d'écran, pour un même geste de l'utilisateur. -->
      <a href="index.html">
        <span class="brand-name">{{nom}}</span>
        <span class="brand-title">{{fonction}}</span>
      </a>
    </div>

    <!-- Navigation. Le menu déroulant repose sur <details> : neuf entrées ne
         tiennent pas en ligne, et ce choix évite d'en dépendre d'un script. -->
    <nav class="site-nav" aria-label="Navigation principale">
      <details class="nav-prestations">
        <summary>Prestations</summary>
        <ul>
{{menu-prestations}}
        </ul>
      </details>
      <a href="contact.html" class="nav-contact">Contact, information, devis</a>
    </nav>
  </div>
</header>

<!-- ====== Contenu ====== -->
<main class="site-main" id="contenu">
  <div class="container page">
    <h1 class="page-title">{{titre}}</h1>
    <div class="page-intro">{{intro}}</div>
{{corps}}
  </div>
</main>

<!-- ====== Pied de page ====== -->
<footer class="site-footer">
  <div class="container">
    <a href="mentions-legales.html" class="footer-legal">Mentions légales</a>
    <p class="footer-copy">{{nom}} — {{fonction}}</p>
  </div>
</footer>

<script>
  // Referme le menu quand on clique ailleurs : sans cela, <details> resterait
  // ouvert jusqu'à un second clic sur son propre titre.
  document.addEventListener('click', function (e) {
    var menu = document.querySelector('.nav-prestations');
    if (menu && menu.open && !menu.contains(e.target)) { menu.open = false; }
  });
</script>
{{scripts}}
</body>
</html>
