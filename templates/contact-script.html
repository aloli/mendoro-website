<script>
  // Le service de réception (crystal-forms) impose quatre champs : « name »
  // et « message » sont obligatoires, « email » alimente le Reply-To,
  // « subject » le sujet du courriel. Tout autre champ est repris tel quel
  // dans le corps, son nom servant de libellé — d'où les clés en toutes
  // lettres ci-dessous, qui donnent un courriel lisible sans mise en forme
  // supplémentaire côté service.
  function construirePayload(donnees) {
    function champ(nom) { return (donnees.get(nom) || '').trim(); }

    var prenom = champ('prenom');
    var nom = champ('nom');
    var adresse = champ('adresse');
    var contexte = champ('contexte');

    // L'adresse du bien est envoyée résolue : Erik en lit toujours une seule,
    // sans avoir à interpréter le choix « identique / autre ».
    var adresseBien = champ('bien_adresse_type') === 'autre'
      ? champ('bien_adresse')
      : adresse;

    var payload = {
      name: (prenom + ' ' + nom).trim(),
      email: champ('email'),
      subject: champ('demande'),
      // « message » est obligatoire : le contexte étant facultatif dans le
      // formulaire, une phrase de remplacement évite un refus en 422.
      message: contexte || 'Aucun contexte précisé par le demandeur.',
      _gotcha: champ('_gotcha')
    };

    // Champs libres. Les valeurs vides sont écartées par le service, mais
    // autant ne pas les envoyer.
    var complements = {
      'Téléphone': champ('tel'),
      'Adresse postale': adresse,
      'Adresse du bien': adresseBien,
      'Section cadastrale': champ('cadastre_section').toUpperCase(),
      'Numéro de parcelle': champ('cadastre_numero')
    };
    Object.keys(complements).forEach(function (cle) {
      if (complements[cle]) { payload[cle] = complements[cle]; }
    });

    return payload;
  }

  // Une prestation passée en paramètre présélectionne la nature de la
  // demande : le visiteur arrive du descriptif, il n'a pas à la rechercher.
  function preselectionnerDemande() {
    var voulue = new URLSearchParams(location.search).get('demande');
    if (!voulue) { return; }
    var select = document.getElementById('demande');
    var option = [].slice.call(select.options).find(function (o) {
      return o.text === voulue;
    });
    // Un libellé inconnu — prestation renommée, lien ancien — est ignoré
    // plutôt que d'imposer une valeur que le service ne reconnaîtrait pas.
    if (option) { select.value = option.value || option.text; }
  }

  document.addEventListener('DOMContentLoaded', function () {
    preselectionnerDemande();
    // Champ « autre adresse » révélé seulement quand il est pertinent.
    var group = document.getElementById('bien-adresse-group');
    var input = document.getElementById('bien_adresse');
    document.querySelectorAll('input[name="bien_adresse_type"]').forEach(function (radio) {
      radio.addEventListener('change', function () {
        var autre = this.value === 'autre';
        group.hidden = !autre;
        input.required = autre;
        if (autre) { input.focus(); } else { input.value = ''; }
      });
    });

    // Envoi AJAX, pour rester sur la page.
    var form = document.getElementById('contact-form');
    var status = document.getElementById('form-status');
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      status.style.display = 'block';
      status.style.color = '';
      status.textContent = 'Envoi en cours…';

      var body = construirePayload(new FormData(form));

      fetch(form.action, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      }).then(function (res) {
        return res.json().then(function (json) { return { ok: res.ok, json: json }; });
      }).then(function (result) {
        if (result.ok && result.json.success) {
          status.style.color = '#5c7c63';
          status.textContent = 'Demande envoyée. Je vous rappelle dans la semaine.';
          form.reset();
          group.hidden = true;
        } else {
          status.style.color = '#b3261e';
          status.textContent = result.json.error || 'Une erreur est survenue.';
        }
      }).catch(function () {
        status.style.color = '#b3261e';
        status.textContent = 'Impossible de contacter le serveur. Réessayez plus tard.';
      });
    });
  });
</script>
